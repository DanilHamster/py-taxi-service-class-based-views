{%  extends "base.html" %}
{% block content %}
  <h1>List of Drivers</h1>
  <ul>
    {% for driver in driver_list %}
      <li><a href="{% url "taxi:driver-detail" driver.id %}">{{ driver.username }}</a></li>
    {% empty %}
      <p>No such driver</p>
    {% endfor %}
  </ul>
{% endblock %}
